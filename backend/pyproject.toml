[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = '''
/(migrations|staticfiles|htmlcov)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["**/migrations/**", "staticfiles", "htmlcov"]

[tool.ruff.lint]
# Explicit rule set so CI results do not change with ruff's default rules
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
# Nested ifs are often clearer than one long condition
ignore = ["SIM102"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts must call django.setup() before importing models
"scripts/*" = ["E402"]
