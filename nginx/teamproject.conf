# Upstream definitions
upstream backend_api {
    server backend:8000;
}

upstream frontend_app {
    server web-frontend:3001;
}

# HTTP - Redirect to HTTPS (or serve directly in local dev)
server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.deep-technologies\.com$ teamproject.deep-technologies.com ~^(?<subdomain>.+)\.localhost$ localhost;

    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static files from Django
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API & Admin routes to Django Multi-tenant Backend
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
        proxy_read_timeout 120s;
    }

    # Next.js Frontend (Plane-inspired UI)
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
        proxy_cache_bypass $http_upgrade;
    }
}
