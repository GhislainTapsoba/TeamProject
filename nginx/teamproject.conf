
resolver 127.0.0.11;
upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
}

# Anti-abus : debit par IP sur l'API (les limites fines sont gerees par Django)
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_status 429;

upstream frontend_app {
    zone frontend_app 64k;
    server web-frontend:3001 resolve;
}

# HTTP - Redirect to HTTPS (or serve directly in local dev)
server {
    listen 80;

    server_name ~^(?<subdomain>.+)\.deep-technologies\.com$ teamproject.deep-technologies.com ~^(?<subdomain>.+)\.localhost$ localhost;

    client_max_body_size 50M;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static files from Django
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API & Admin routes to Django Multi-tenant Backend
    location ~ ^/(api|admin)/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
        proxy_read_timeout 120s;
    }

    # Next.js Frontend (Plane-inspired UI)
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
        proxy_cache_bypass $http_upgrade;
    }
}
