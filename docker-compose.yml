services:
  # PostgreSQL Database (django-tenants schema isolation)
  postgres:
    image: postgres:15-alpine
    container_name: teamproject-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamproject}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-teamproject}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Redis (Celery broker & cache)
  redis:
    image: redis:7-alpine
    container_name: teamproject-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Django Multi-Tenant Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamproject-backend
    command: >
      sh -c "
        echo 'Attente de la base de données PostgreSQL...' &&
        while ! nc -z postgres 5432; do sleep 1; done &&
        echo 'Création des migrations initiales...' &&
        python manage.py makemigrations &&
        echo 'Migration du schéma public (SHARED_APPS)...' &&
        python manage.py migrate_schemas --shared &&
        echo 'Migration des schémas tenants (TENANT_APPS)...' &&
        python manage.py migrate_schemas &&
        echo 'Démarrage de Gunicorn...' &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-prod-key-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-teamproject}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CINETPAY_API_KEY: ${CINETPAY_API_KEY}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-v1rZk5g7qHk_7D4B6T9u8-v2h1j3k4l5m6n7o8p9q0r=}
      FRONTEND_URL: https://teamproject.deep-technologies.com
      PLATFORM_DOMAIN: deep-technologies.com
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # Celery Worker (Async emails & notifications)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamproject-celery-worker
    command: celery -A config worker -l info
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamproject}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-v1rZk5g7qHk_7D4B6T9u8-v2h1j3k4l5m6n7o8p9q0r=}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  # Celery Beat (Periodic reminders & subscriptions check)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamproject-celery-beat
    command: celery -A config beat -l info
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamproject}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  # Next.js Frontend (Plane-inspired UI)
  web-frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://teamproject.deep-technologies.com/api
    container_name: teamproject-frontend
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: https://teamproject.deep-technologies.com/api
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - backend
    restart: always

  # Reverse Proxy Nginx Wildcard
  nginx:
    image: nginx:alpine
    container_name: teamproject-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/teamproject.conf:/etc/nginx/conf.d/default.conf:ro
      - static-data:/app/staticfiles:ro
    depends_on:
      - backend
      - web-frontend
    restart: always

volumes:
  postgres-data:
  static-data:
